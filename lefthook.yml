assert_lefthook_installed: true
no_auto_install: true

rc: ./.lefthookrc

pre-commit:
  jobs:
    - name: development-system-staged_wit_versions
      run: "'./.githooks/pre-commit'"
    - name: development-system-staged_safety
      run: "'./scripts/pre-commit-safety.sh'"

pre-push:
  jobs:
    - name: development-system-fast_push
      # Give Lefthook a fixed file so it dispatches even when the push changes no files.
      # The hook determines scope from Git's ref updates on stdin.
      files: git ls-files -- lefthook.yml
      run: ': {files}; ./.githooks/pre-push "${IRONCLAW_HOOK_ARGUMENT:-origin}" --fast --git-hook'
      use_stdin: true

commit-msg:
  jobs:
    - name: regression-test
      run: './scripts/commit-msg-regression.sh "${IRONCLAW_HOOK_ARGUMENT:-$(git rev-parse --git-path COMMIT_EDITMSG)}"'
