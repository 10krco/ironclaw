name: Tests (Reborn)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
      deep_generations:
        description: >-
          Enumerate longer generated lifecycle sequences (#6524 workstream 9).
          Pull requests stay at the fast depth; the nightly deep run raises it.
          Depth 3 is 39 sequences against depth 2's 12.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
  pull_request:
    branches:
      # Release branches get the same gate as main: a release-blocker fix
      # opened against a frozen candidate must clear the deterministic Reborn
      # suite before it can produce a new rc. `release-fix-*` is the 1.0.0-era
      # name; `release/*` is the weekly cut named in
      # docs/internal/weekly-release-strategy.md.
      - main
      - "release-fix-*"
      - "release/*"
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reborn-tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch the real OS keychain (macOS Keychain auth dialog /
  # Linux Secret Service). Guarded by
  # crates/substrates/ironclaw_secrets/src/keychain.rs::os_keychain_suppressed:
  # cfg!(test) covers unit tests; this covers integration/e2e that link the
  # non-cfg(test) library.
  IRONCLAW_DISABLE_OS_KEYCHAIN: "1"
  # Generated-sequence depth for tests/integration/generated_gate_sequences.rs.
  # Evaluates to the fast depth on every trigger except a workflow_call that
  # explicitly asks for more, so a PR never pays the nightly cost. The test
  # parses this strictly and fails on a bad value rather than falling back,
  # so a typo here cannot silently downgrade the nightly lane.
  IRONCLAW_GENERATED_SEQUENCE_DEPTH: ${{ inputs.deep_generations && '3' || '2' }}
  # The same full-scope nightly reuse increases every existing proptest
  # boundary generator instead of maintaining a duplicate randomized list.
  # Proptest reports its random seed on failure for exact local replay.
  PROPTEST_CASES: ${{ inputs.deep_generations && '2048' || '256' }}
  # Pin wall-clock rendering inputs so a test cannot pass or fail on the
  # runner's locale. Reborn renders model-visible time slices, and date/number
  # formatting differs by locale, so an unpinned runner turns a formatting
  # regression into an unreproducible flake. UTC also keeps recorded fixtures
  # comparable with what a developer sees locally.
  TZ: "UTC"
  LANG: "C.UTF-8"
  # PR #5086 measured mold linking the heaviest Reborn build in parallel with
  # no OOM, so keep Cargo's default parallelism. If runner OOMs recur, restore
  # the previous one-job Cargo build serialization as the one-line fallback.
  # Cargo network resilience (retries, HTTP/2 multiplexing off, git-CLI fetch)
  # lives in the repo-wide .cargo/config.toml so it applies to every workflow.

jobs:
  changes:
    name: Detect Reborn test scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_mode: ${{ steps.plan.outputs.plan_mode }}
      run_crate_tests: ${{ steps.plan.outputs.run_crate_tests }}
      crate_buckets: ${{ steps.plan.outputs.crate_buckets }}
      run_root_tests: ${{ steps.plan.outputs.run_root_tests }}
      root_partitions: ${{ steps.plan.outputs.root_partitions }}
      run_integration_tests: ${{ steps.plan.outputs.run_integration_tests }}
      integration_batches: ${{ steps.plan.outputs.integration_batches }}
      run_qa_replay: ${{ steps.plan.outputs.run_qa_replay }}
      run_sandbox_docker: ${{ steps.plan.outputs.run_sandbox_docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          # PR planning keeps full ancestry for its three-dot diff. A
          # merge-group checkout is the candidate commit only; its base is
          # fetched below.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          # Checkout still materializes the complete execution tree used by the
          # planner while omitting historical blobs.
          filter: blob:none
          persist-credentials: false
      - name: Fetch merge-group base for scope diff
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rust
      - id: plan
        name: Build affected-area test plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed_args=()
          base_args=()
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group" ]]; then
            if [[ "${{ github.event_name }}" == "merge_group" ]]; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > "${RUNNER_TEMP}/reborn-changed-files.txt"
            else
              git diff --name-only "$BASE_SHA"..."$HEAD_SHA" \
                > "${RUNNER_TEMP}/reborn-changed-files.txt"
            fi
            changed_args=(--changed-files "${RUNNER_TEMP}/reborn-changed-files.txt")
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_args=(--base-sha "$BASE_SHA")
          fi

          python3 scripts/ci/test_reborn_pr_test_plan.py
          python3 scripts/ci/test_pre_commit_staged_paths.py
          scripts/ci/discover-reborn-package-crates.sh \
            > "${RUNNER_TEMP}/reborn-canonical-packages.json"
          plan="$(
            python3 scripts/ci/reborn_pr_test_plan.py \
              --event "${{ github.event_name }}" \
              --canonical-packages "${RUNNER_TEMP}/reborn-canonical-packages.json" \
              "${base_args[@]}" \
              "${changed_args[@]}"
          )"
          printf '%s\n' "${plan}" | jq .
          canonical="$(cat "${RUNNER_TEMP}/reborn-canonical-packages.json")"
          if ! jq -e --argjson canonical "${canonical}" '
            .mode != "full" or (
              ([.crate_buckets[].packages[]] | sort) == ($canonical | sort)
              and .root_partitions == [0, 1, 2, 3]
              and .integration_lanes == [0, 1, 2, 3, "groups"]
              and .run_qa_replay == true
              and .run_sandbox_docker == true
            )
          ' <<< "${plan}" > /dev/null; then
            echo "Full Reborn plan is not exhaustive"
            exit 1
          fi
          {
            echo "### Reborn affected-area plan"
            echo
            echo "- Mode: $(jq -r '.mode' <<< "${plan}")"
            echo "- Reasons: $(jq -r '.reasons | join("; ")' <<< "${plan}")"
            echo "- Crate buckets: $(jq -r '.crate_buckets | length' <<< "${plan}")"
            echo "- Root partitions: $(jq -c '.root_partitions' <<< "${plan}")"
            echo "- Integration lanes: $(jq -c '.integration_lanes' <<< "${plan}")"
            echo "- Sandbox Docker: $(jq -r '.run_sandbox_docker' <<< "${plan}")"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "plan_mode=$(jq -r '.mode' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_crate_tests=$(jq -r '.crate_buckets | length > 0' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "crate_buckets=$(jq -c '.crate_buckets' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_root_tests=$(jq -r '.root_partitions | length > 0' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "root_partitions=$(jq -c '.root_partitions' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_integration_tests=$(jq -r '.integration_lanes | length > 0' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            integration_batches="$(
              jq -c '[.integration_lanes[] | {id: tostring, lanes: [.]}]' <<< "${plan}"
            )"
          else
            integration_batches="$(
              jq -c '[{id: "selected", lanes: .integration_lanes}]' <<< "${plan}"
            )"
          fi
          echo "integration_batches=${integration_batches}" >> "$GITHUB_OUTPUT"
          echo "run_qa_replay=$(jq -r '.run_qa_replay' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_sandbox_docker=$(jq -r '.run_sandbox_docker' <<< "${plan}")" >> "$GITHUB_OUTPUT"

          scripts/ci/check-test-suite-boundaries.sh

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/ci/test-critical-mutation-gate.sh
            python3 scripts/ci/critical_mutation_gate.py \
              --manifest tests/integration/critical-mutation-functions.toml \
              --changed-files "${RUNNER_TEMP}/reborn-changed-files.txt" \
              --selection-only
          fi

  git-hook-contract:
    name: Git hook contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Lefthook 2.2.2
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/git-hook-contract"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/evilmartians/lefthook/releases/download/v2.2.2/lefthook_2.2.2_Linux_x86_64 \
            --output "$bin_dir/lefthook"
          printf '%s  %s\n' \
            4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6 \
            "$bin_dir/lefthook" | sha256sum --check --status
          chmod +x "$bin_dir/lefthook"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Verify Git hook migration and dispatch
        run: |
          set -euo pipefail
          lefthook validate
          python3 scripts/ci/test_factory_hooks.py

  crate-tests:
    name: Test Reborn crate bucket (${{ matrix.bucket.name }})
    needs: changes
    if: needs.changes.outputs.run_crate_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      # The deep composed-runtime futures (turn -> capability -> skills script
      # mount, and the channel admission chain) overflow the 2 MiB default
      # test-thread stack on this lane's Linux codegen — first observed as a
      # SIGABRT in composition-core's
      # `the_model_runs_a_skills_script_from_the_workdir_the_body_advertises`;
      # 8 MiB was the measured headroom, and the deepest subtrees stay
      # Box::pin'd at their seams — this is headroom, not a substitute.
      # Job-level on purpose, and the same 64 MiB in every hermetic lane:
      # rust-cache hashes job-level RUST* variables into its cache key, so a
      # per-lane value would split the shared `reborn-hermetic` lineage into
      # keys no other lane can restore, and
      # A larger minimum than a lane strictly needs is a virtual reservation
      # per thread, not committed memory.
      RUST_MIN_STACK: "67108864"
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      matrix:
        bucket: ${{ fromJSON(needs.changes.outputs.crate_buckets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure isolated Corepack path
        run: echo "COREPACK_HOME=${RUNNER_TEMP}/ironclaw-corepack" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          mold: true

      - name: Resolve bucket settings
        id: bucket-settings
        env:
          BUCKET_PACKAGES: ${{ toJSON(matrix.bucket.packages) }}
          CARGO_PACKAGES: ${{ toJSON(matrix.bucket.cargo_packages || fromJSON('[]')) }}
          EXACT_TARGETS: ${{ toJSON(matrix.bucket.exact_targets || fromJSON('[]')) }}
        run: |
          needs_webui_node=false
          needs_postgres_image=false
          needs_nextest=false
          sccache_dist_enabled=true

          if jq -e -n \
            --argjson packages "${BUCKET_PACKAGES}" \
            --argjson cargo_packages "${CARGO_PACKAGES}" \
            --argjson exact_targets "${EXACT_TARGETS}" '
              ($exact_targets | length) == 0 and
              (($packages - $cargo_packages) | length) > 0
            ' >/dev/null; then
            needs_nextest=true
          fi

          while IFS= read -r package; do
            feature_flags="$(scripts/ci/package-feature-flags.sh "$package")"
            # These packages link `ironclaw_webui`, whose build script compiles
            # the Vite frontend and therefore needs a Node/pnpm toolchain.
            case "${package}" in
              ironclaw|ironclaw_composition|ironclaw_webui)
                needs_webui_node=true
                ;;
            esac

            case "${package}" in
              ironclaw_composition|ironclaw_triggers)
                needs_postgres_image=true
                ;;
            esac

            case "${package}" in
              ironclaw|ironclaw_host_runtime|ironclaw_loop_host|ironclaw_assistant|ironclaw_turn_runner|ironclaw_composition|ironclaw_webui|ironclaw_wasm)
                sccache_dist_enabled=false
                ;;
            esac
          done < <(printf '%s\n' "${BUCKET_PACKAGES}" | jq -r '.[]')

          echo "needs_webui_node=${needs_webui_node}" >> "${GITHUB_OUTPUT}"
          echo "needs_postgres_image=${needs_postgres_image}" >> "${GITHUB_OUTPUT}"
          echo "needs_nextest=${needs_nextest}" >> "${GITHUB_OUTPUT}"
          echo "sccache_dist_enabled=${sccache_dist_enabled}" >> "${GITHUB_OUTPUT}"

      - name: Pre-pull Postgres test image
        if: ${{ steps.bucket-settings.outputs.needs_postgres_image == 'true' }}
        run: docker pull postgres:16-alpine

      - name: Enable pnpm for setup-node cache
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        run: corepack enable pnpm

      - name: Install Node.js for WebUI bundle builds
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          # actions/setup-node hashes this list to build the cache key
          # (verified against the pinned commit's bundled dist/setup/index.js:
          # `hashFiles` walks one globber built from every newline-separated
          # pattern and only throws when the COMBINED walk finds nothing), so
          # the exact line stays live for today's tree (WS7 put the crate in
          # `crates/product/`) and the deeper glob picks up any later re-homing
          # without either one needing to be conditional. The two must not
          # overlap: `ws12_workflow_contracts.py` rejects a spare that already
          # matches the real location, because a pattern matching everything is
          # broad rather than depth-tolerant.
          cache-dependency-path: |
            crates/product/ironclaw_webui/frontend/pnpm-lock.yaml
            crates/*/*/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies for tests
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        run: |
          set -euo pipefail
          webui_dir="$(bash scripts/ci/crate-dir.sh ironclaw_webui)"
          cd "${webui_dir}/frontend"
          pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # ONE shared cache for all ~60 crate-test jobs instead of a per-crate
          # key. Per-crate keys produced ~60 caches (registry + target each,
          # ~0.4-0.7 GB), which blew far past GitHub's ~10 GB repo cache LRU and
          # evicted each other — so most jobs hit "No cache found", re-downloaded
          # the crates.io registry from cold, and were exposed to transient
          # download flakes (mitigated separately by .cargo/config.toml). A single
          # shared key keeps the registry + shared-dep build in one small,
          # always-resident entry, so the registry is downloaded once, not ~60x.
          #
          #
          # `reborn-hermetic` is the one plain lineage for every lane that
          # builds inside scripts/ci/run-hermetic-test-process.sh (crate
          # buckets, root partitions, integration batch, QA replay, the Rust
          # Reborn E2E groups): same toolchain, same RUSTFLAGS, same stable
          # hermetic Cargo home, so one entry serves all of them. Only the
          # push run's root partitions and QA replay save it: a shared key is
          # written once per lockfile by the first job to finish, and those
          # jobs build the same complete integration-test closure, so whichever
          # wins saves the same content. Everything else restores.
          shared-key: reborn-hermetic
          # Saved from pushes to main only; pull-request and merge-queue runs
          # restore. A merge_group save lands on the queue entry's own
          # gh-readonly-queue ref, which no pull request and no later queue
          # entry can restore (GitHub scopes a run to its own ref, its base
          # and the default branch), so those saves were write-only and their
          # 6-7 GB per entry evicted main's caches from the 10 GB repo limit.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup OVH sccache
        uses: ./.github/actions/setup-sccache-dist
        with:
          scheduler-url: ${{ steps.bucket-settings.outputs.sccache_dist_enabled == 'true' && vars.SCCACHE_DIST_SCHEDULER_URL || '' }}
          auth-token: ${{ steps.bucket-settings.outputs.sccache_dist_enabled == 'true' && secrets.SCCACHE_DIST_AUTH_TOKEN || '' }}
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Install cargo-nextest
        if: steps.bucket-settings.outputs.needs_nextest == 'true'
        uses: taiki-e/install-action@62b0f2dec647a8e604c6a0fda0e38530180dce20 # v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Run crate tests
        env:
          BUCKET_NAME: ${{ matrix.bucket.name }}
          BUCKET_PACKAGES: ${{ toJSON(matrix.bucket.packages) }}
          CARGO_PACKAGES: ${{ toJSON(matrix.bucket.cargo_packages || fromJSON('[]')) }}
          EXACT_TARGETS: ${{ toJSON(matrix.bucket.exact_targets || fromJSON('[]')) }}
        run: |
          echo "Running Reborn crate bucket: ${BUCKET_NAME}"
          printf '%s\n' "${BUCKET_PACKAGES}" | jq -r '.[] | "- " + .'

          scripts/ci/run-hermetic-deterministic-suite.sh prepare-command
          export IRONCLAW_HERMETIC_SUITE_SKIP_PREPARE=1
          nextest_packages=()
          nextest_package_args=()
          nextest_feature_args=()
          cargo_package_args=()
          cargo_feature_args=()
          incremental_env=()
          if ! jq -e --argjson packages "${BUCKET_PACKAGES}" '
            type == "array" and length == (unique | length) and
            all(.[]; . as $package | $packages | index($package) != null)
          ' <<< "${CARGO_PACKAGES}" >/dev/null; then
            echo "cargo_packages must be a unique subset of bucket packages" >&2
            exit 1
          fi
          while IFS= read -r package; do
            if jq -e --arg package "$package" 'index($package) != null' \
              <<< "${CARGO_PACKAGES}" >/dev/null; then
              cargo_package_args+=(-p "$package")
              subset_feature_args_name=cargo_feature_args
            else
              nextest_packages+=("$package")
              nextest_package_args+=(-p "$package")
              subset_feature_args_name=nextest_feature_args
            fi
            feature_flags="$(scripts/ci/package-feature-flags.sh "$package")"
            if [[ -n "${feature_flags}" ]]; then
              features="${feature_flags#--features }"
              IFS=, read -ra package_features <<< "${features}"
              for feature in "${package_features[@]}"; do
                declare -n subset_feature_args="${subset_feature_args_name}"
                subset_feature_args+=(--features "${package}/${feature}")
                unset -n subset_feature_args
              done
            fi
            if [[ "$package" == "ironclaw_composition" ]]; then
              incremental_env=(env CARGO_INCREMENTAL=0)
            fi
          done < <(printf '%s\n' "${BUCKET_PACKAGES}" | jq -r '.[]')

          echo "::group::cargo test affected bucket ${BUCKET_NAME}"
          if [[ "$(jq 'length' <<< "${EXACT_TARGETS}")" -gt 0 ]]; then
            if [[ "$(jq 'length' <<< "${CARGO_PACKAGES}")" -gt 0 ]]; then
              echo "exact_targets and cargo_packages are mutually exclusive" >&2
              exit 1
            fi
            while IFS=$'\t' read -r package kind name; do
              target_feature_args=()
              feature_flags="$(scripts/ci/package-feature-flags.sh "${package}")"
              if [[ -n "${feature_flags}" ]]; then
                read -ra target_feature_args <<< "${feature_flags}"
              fi
              scripts/ci/run-hermetic-deterministic-suite.sh command \
                timeout --signal=INT --kill-after=30s 28m \
                "${incremental_env[@]}" cargo test \
                  -p "${package}" "--${kind}" "${name}" \
                  "${target_feature_args[@]}" --ignore-rust-version -- --nocapture
            done < <(
              jq -r '.[] | [.package, .kind, .name] | @tsv' \
                <<< "${EXACT_TARGETS}"
            )
          else
            if [[ "${#nextest_package_args[@]}" -gt 0 ]]; then
              if [[ " ${nextest_packages[*]} " == *" ironclaw "* ||
                    " ${nextest_packages[*]} " == *" ironclaw_composition "* ]]; then
              nextest_group_report="$(
                scripts/ci/run-hermetic-deterministic-suite.sh command \
                  timeout --signal=INT --kill-after=30s 28m \
                  "${incremental_env[@]}" cargo nextest show-config \
                    test-groups --profile ci \
                    "${nextest_package_args[@]}" "${nextest_feature_args[@]}" \
                    --all-targets --ignore-rust-version \
                    --no-pager --color never
              )"
              group_test_specs=(
                'ironclaw|ironclaw-smoke-process-local|onboard_login_link_then_bearer_authorizes_a_protected_request'
                'ironclaw|ironclaw-cli-global-policy|commands::traces::tests::opt_in_writes_runtime_owner_policy'
                'ironclaw_composition|composition-runtime-process-local|f1_happy_path_records_actual_usd_on_receipt'
                'ironclaw_composition|composition-runtime-process-local|runtime_rejects_disabled_profile_before_local_substrate_lookup'
              )
              for group_test_spec in "${group_test_specs[@]}"; do
                IFS='|' read -r package group test_name <<< "${group_test_spec}"
                if [[ " ${nextest_packages[*]} " != *" ${package} "* ]]; then
                  continue
                fi
                if ! awk -v header="group: ${group} (max threads = 1)" \
                  -v test_name="${test_name}" '
                    $0 == header { in_group = 1; found_group = 1; next }
                    /^group: / { in_group = 0 }
                    in_group && index($0, test_name) { found_test = 1 }
                    END { exit !(found_group && found_test) }
                  ' <<< "${nextest_group_report}"; then
                  echo "nextest group ${group} did not contain ${test_name}" >&2
                  exit 1
                fi
              done
              fi
              scripts/ci/run-hermetic-deterministic-suite.sh command \
                timeout --signal=INT --kill-after=30s 28m \
                "${incremental_env[@]}" cargo nextest run --profile ci \
                  "${nextest_package_args[@]}" "${nextest_feature_args[@]}" \
                  --test-threads 4 --all-targets --ignore-rust-version \
                  --no-tests pass
            fi
            if [[ "${#cargo_package_args[@]}" -gt 0 ]]; then
              scripts/ci/run-hermetic-deterministic-suite.sh command \
                timeout --signal=INT --kill-after=30s 28m \
                "${incremental_env[@]}" cargo test "${cargo_package_args[@]}" \
                  "${cargo_feature_args[@]}" --ignore-rust-version \
                  --all-targets -- --nocapture
            fi
          fi
          echo "::endgroup::"

  root-reborn-parity-tests:
    name: Reborn root tests (${{ matrix.partition }})
    needs: changes
    if: needs.changes.outputs.run_root_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      REBORN_ROOT_TEST_PARTITIONS: 4
      REBORN_ROOT_TEST_PARTITION: ${{ matrix.partition }}
      REBORN_ROOT_TEST_TIMEOUT: 28m
      CARGO_INCREMENTAL: "0"
      # The QA smoke binaries build a full Reborn runtime and drive whole
      # turns on the libtest current-thread stack; the combined debug async
      # frames of that pipeline overflow the 8 MiB default (measured need:
      # ~10 MiB for reborn_qa_smoke_scenarios_e2e). Same pathology and value
      # as the documented RUST_MIN_STACK in reborn_qa_recorded_behavior.rs.
      # Job-level and identical across the hermetic lanes: see crate-tests.
      RUST_MIN_STACK: "67108864"
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 1 || 4 }}
      matrix:
        partition: ${{ fromJSON(needs.changes.outputs.root_partitions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          mold: true

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # All 4 root partitions compile the *same* root-package build (they
          # only run different test partitions), and that build is the same
          # hermetic stable+mold build every other guarded lane makes, so they
          # share the one `reborn-hermetic` lineage (see crate-tests above).
          # These push-run jobs (and QA replay) are the lineage's producers.
          shared-key: reborn-hermetic
          # Saved from pushes to main only; pull-request and merge-queue runs
          # restore. A merge_group save lands on the queue entry's own
          # gh-readonly-queue ref, which no pull request and no later queue
          # entry can restore (GitHub scopes a run to its own ref, its base
          # and the default branch), so those saves were write-only and their
          # 6-7 GB per entry evicted main's caches from the 10 GB repo limit.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup OVH sccache cache
        uses: ./.github/actions/setup-sccache-dist
        with:
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Run Reborn root tests
        run: >-
          scripts/ci/run-hermetic-deterministic-suite.sh
          command
          scripts/ci/run-reborn-root-partition.sh

  sandbox-docker-tests:
    name: Reborn user-sandbox Docker tests
    needs: changes
    if: needs.changes.outputs.run_sandbox_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      IRONCLAW_REQUIRE_DOCKER_TESTS: "1"
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          mold: true

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # `reborn-direct` is the plain lineage for lanes that run cargo
          # directly (no hermetic wrapper, so the host Cargo home): this job
          # saves it on push, the merge-queue mutation gate restores it.
          shared-key: reborn-direct
          # Saved from pushes to main only; pull-request and merge-queue runs
          # restore. A merge_group save lands on the queue entry's own
          # gh-readonly-queue ref, which no pull request and no later queue
          # entry can restore (GitHub scopes a run to its own ref, its base
          # and the default branch), so those saves were write-only and their
          # 6-7 GB per entry evicted main's caches from the 10 GB repo limit.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Prepare sandbox worker and proxy images
        run: |
          docker pull ironsh/iron-proxy@sha256:c4628019c24f4cc8d77564a26b7c9cedb00accee6f93d06270e85fb8f9c6a7da
          docker build -f Dockerfile.sandbox-worker -t ironclaw-worker:latest .

      - name: Verify production local-sandbox profile wiring
        run: cargo test -p ironclaw local_sandbox_profile_selects_docker_process_binding_when_required -- --nocapture

      - name: Run real-Docker user sandbox contract
        # Each test creates a transport that reconciles the daemon-wide user-container
        # inventory. Run this shared-Docker contract serially so one test's sweeper
        # cannot adopt and stop another test's intentionally active container.
        run: cargo test -p ironclaw_sandbox --test user_sandbox_docker_live -- --nocapture --test-threads=1

      - name: Run full-turn sandbox shell integration
        run: cargo test -p ironclaw_integration_tests --test reborn_integration_sandbox_shell_turn -- --nocapture

  reborn-integration-tests:
    name: IronClaw integration tests (${{ matrix.batch.id }})
    needs: changes
    if: needs.changes.outputs.run_integration_tests == 'true'
    runs-on: ubuntu-latest
    # Push runs one lane per job (120m); non-push events combine
    # lanes, so 300m covers their summed lane budgets and shared setup.
    timeout-minutes: ${{ github.event_name == 'push' && 120 || 300 }}
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      CARGO_INCREMENTAL: "0"
      # Match the stack budget of the other hermetic Reborn lanes.
      RUST_MIN_STACK: "67108864"
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.changes.outputs.integration_batches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure isolated Corepack path
        run: echo "COREPACK_HOME=${RUNNER_TEMP}/ironclaw-corepack" >> "$GITHUB_ENV"

      - name: Pre-pull Postgres test image
        run: docker pull postgres:16-alpine

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          mold: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@62b0f2dec647a8e604c6a0fda0e38530180dce20 # v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Enable pnpm for setup-node cache
        run: corepack enable pnpm

      - name: Install Node.js for WebUI bundle builds
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          # actions/setup-node hashes this list to build the cache key
          # (verified against the pinned commit's bundled dist/setup/index.js:
          # `hashFiles` walks one globber built from every newline-separated
          # pattern and only throws when the COMBINED walk finds nothing), so
          # the exact line stays live for today's tree (WS7 put the crate in
          # `crates/product/`) and the deeper glob picks up any later re-homing
          # without either one needing to be conditional. The two must not
          # overlap: `ws12_workflow_contracts.py` rejects a spare that already
          # matches the real location, because a pattern matching everything is
          # broad rather than depth-tolerant.
          cache-dependency-path: |
            crates/product/ironclaw_webui/frontend/pnpm-lock.yaml
            crates/*/*/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies
        run: |
          set -euo pipefail
          webui_dir="$(bash scripts/ci/crate-dir.sh ironclaw_webui)"
          cd "${webui_dir}/frontend"
          pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Share the plain test build cache with the other Reborn lanes.
          shared-key: reborn-hermetic
          # Saved from pushes to main only; pull-request and merge-queue runs
          # restore. A merge_group save lands on the queue entry's own
          # gh-readonly-queue ref, which no pull request and no later queue
          # entry can restore (GitHub scopes a run to its own ref, its base
          # and the default branch), so those saves were write-only and their
          # 6-7 GB per entry evicted main's caches from the 10 GB repo limit.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run this IronClaw integration batch
        env:
          REBORN_COV_LANES_JSON: ${{ toJSON(matrix.batch.lanes) }}
          REBORN_COV_LANE_TEST_TIMEOUT: 45m
          REBORN_COV_COLLECT: "false"
        run: |
          scripts/ci/run-hermetic-deterministic-suite.sh prepare-command
          IRONCLAW_HERMETIC_SUITE_SKIP_PREPARE=1 \
            scripts/ci/run-hermetic-deterministic-suite.sh command \
            scripts/ci/reborn-coverage-lane-run.sh

  critical-mutation:
    name: Critical named-function mutation gate
    needs: changes
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run critical-gate harness self-tests
        run: scripts/ci/test-critical-mutation-gate.sh

      - name: Resolve affected critical functions
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
          should_run="$(
            python3 scripts/ci/critical_mutation_gate.py \
              --manifest tests/integration/critical-mutation-functions.toml \
              --changed-files changed-files.txt \
              --selection-only
          )"
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          mold: true

      # Restore the direct-cargo lineage the sandbox Docker job saves on push,
      # so the baseline build of each named package starts from warm
      # dependencies instead of a cold closure per invariant (the cold shape
      # set a 40-minute merge-queue wall clock when the gate ran everything).
      - name: Restore Rust cache
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: reborn-direct
          save-if: false

      - name: Install cargo-mutants
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        uses: taiki-e/install-action@62b0f2dec647a8e604c6a0fda0e38530180dce20 # v2
        with:
          tool: cargo-mutants@27.1.0

      # `--in-place` mutates this disposable checkout and builds in its own
      # `target/`, which is what lets the restored cache count; cargo-mutants
      # cannot run in place with parallel jobs, so the gate runs one at a
      # time against a warm tree instead of three at a time against cold copies.
      - name: Run affected named critical invariants
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        run: |
          python3 scripts/ci/critical_mutation_gate.py \
            --manifest tests/integration/critical-mutation-functions.toml \
            --changed-files changed-files.txt \
            --in-place

  qa-recorded-fixtures:
    name: Reborn QA recorded fixtures
    needs: changes
    if: needs.changes.outputs.run_qa_replay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      CARGO_INCREMENTAL: "0"
      # This job runs `reborn_qa_recorded_behavior`, whose own module docs
      # require this value: its replay tests build a full Reborn runtime and
      # drive whole turns, and the combined debug async frames sit within a few
      # percent of whatever stack they are given. Measured on this suite: it
      # overflows below 2 MiB and clears at 2 MiB, i.e. the libtest default is
      # the boundary itself, so any layout shift decides it. The root-tests and
      # group-suite jobs already set this for the same pathology; this job was
      # the one that ran the documented binary without it.
      # Job-level and identical across the hermetic lanes: see crate-tests.
      RUST_MIN_STACK: "67108864"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure isolated Corepack path
        run: echo "COREPACK_HOME=${RUNNER_TEMP}/ironclaw-corepack" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          mold: true

      - name: Enable pnpm for setup-node cache
        run: corepack enable pnpm

      - name: Install Node.js for QA replay WebUI bundle builds
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          # actions/setup-node hashes this list to build the cache key
          # (verified against the pinned commit's bundled dist/setup/index.js:
          # `hashFiles` walks one globber built from every newline-separated
          # pattern and only throws when the COMBINED walk finds nothing), so
          # the exact line stays live for today's tree (WS7 put the crate in
          # `crates/product/`) and the deeper glob picks up any later re-homing
          # without either one needing to be conditional. The two must not
          # overlap: `ws12_workflow_contracts.py` rejects a spare that already
          # matches the real location, because a pattern matching everything is
          # broad rather than depth-tolerant.
          cache-dependency-path: |
            crates/product/ironclaw_webui/frontend/pnpm-lock.yaml
            crates/*/*/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies for QA replay
        run: |
          set -euo pipefail
          webui_dir="$(bash scripts/ci/crate-dir.sh ironclaw_webui)"
          cd "${webui_dir}/frontend"
          pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Same hermetic stable+mold build as the root partitions: one
          # shared lineage (see crate-tests), saved by this push-run job.
          shared-key: reborn-hermetic
          # Saved from pushes to main only; pull-request and merge-queue runs
          # restore. A merge_group save lands on the queue entry's own
          # gh-readonly-queue ref, which no pull request and no later queue
          # entry can restore (GitHub scopes a run to its own ref, its base
          # and the default branch), so those saves were write-only and their
          # 6-7 GB per entry evicted main's caches from the 10 GB repo limit.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup OVH sccache cache
        uses: ./.github/actions/setup-sccache-dist
        with:
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Scrub Reborn QA fixtures
        run: |
          scripts/ci/test-check-reborn-qa-fixtures.sh
          scripts/ci/check-reborn-qa-fixtures.sh

      - name: Test fixture promotion guards
        run: |
          bash scripts/ci/test-check-reborn-qa-fixtures.sh
          python3 -m unittest scripts/ci/test-check-regression-promotions.py

      - name: Run Reborn QA fixture contracts and replay
        run: |
          scripts/ci/run-hermetic-deterministic-suite.sh prepare-command
          IRONCLAW_HERMETIC_SUITE_SKIP_PREPARE=1 \
            scripts/ci/run-hermetic-deterministic-suite.sh \
            command \
            cargo test \
            -p ironclaw_integration_tests \
            --test reborn_qa_recorded_behavior \
            -- \
            --nocapture

  reborn-tests:
    name: Tests (Reborn)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    needs:
      - changes
      - git-hook-contract
      - crate-tests
      - root-reborn-parity-tests
      - reborn-integration-tests
      - critical-mutation
      - qa-recorded-fixtures
      - sandbox-docker-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Check Reborn test result
        run: |
          # shellcheck disable=SC1091
          if ! source .github/scripts/ci-job-result-ok.sh; then
            echo "Unable to source .github/scripts/ci-job-result-ok.sh"
            exit 1
          fi

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.git-hook-contract.result }}" != "success" ]]; then
            echo "Git hook contract failed: ${{ needs.git-hook-contract.result }}"
            exit 1
          fi

          plan_mode="${{ needs.changes.outputs.plan_mode }}"
          case "${plan_mode}" in
            none|selected|full) ;;
            *)
              echo "Missing or invalid Reborn test plan mode: '${plan_mode}'"
              exit 1
              ;;
          esac

          for flag in \
            "${{ needs.changes.outputs.run_crate_tests }}" \
            "${{ needs.changes.outputs.run_root_tests }}" \
            "${{ needs.changes.outputs.run_integration_tests }}" \
            "${{ needs.changes.outputs.run_qa_replay }}" \
            "${{ needs.changes.outputs.run_sandbox_docker }}"; do
            if [[ "${flag}" != "true" && "${flag}" != "false" ]]; then
              echo "Missing or invalid Reborn test plan flag: '${flag}'"
              exit 1
            fi
          done

          if [[ "${plan_mode}" == "full" ]]; then
            for flag in \
              "${{ needs.changes.outputs.run_crate_tests }}" \
              "${{ needs.changes.outputs.run_root_tests }}" \
              "${{ needs.changes.outputs.run_integration_tests }}" \
              "${{ needs.changes.outputs.run_qa_replay }}" \
              "${{ needs.changes.outputs.run_sandbox_docker }}"; do
              if [[ "${flag}" != "true" ]]; then
                echo "Full Reborn plan omitted a required lane"
                exit 1
              fi
            done
          fi

          check_planned_job() {
            local name="$1"
            local result="$2"
            local expected="$3"
            if [[ "${expected}" == "false" ]]; then
              if [[ "${result}" != "skipped" ]]; then
                echo "${name} ran with result '${result}' despite planned=false"
                exit 1
              fi
              return
            fi
            if ! job_result_ok "${name}" "${result}" false "allow"; then
              echo "${name} result '${result}' did not match planned=${expected}"
              exit 1
            fi
          }

          check_planned_job "crate-tests" \
            "${{ needs.crate-tests.result }}" \
            "${{ needs.changes.outputs.run_crate_tests }}"
          check_planned_job "root-reborn-parity-tests" \
            "${{ needs.root-reborn-parity-tests.result }}" \
            "${{ needs.changes.outputs.run_root_tests }}"
          check_planned_job "reborn-integration-tests" \
            "${{ needs.reborn-integration-tests.result }}" \
            "${{ needs.changes.outputs.run_integration_tests }}"
          check_planned_job "qa-recorded-fixtures" \
            "${{ needs.qa-recorded-fixtures.result }}" \
            "${{ needs.changes.outputs.run_qa_replay }}"
          check_planned_job "sandbox-docker-tests" \
            "${{ needs.sandbox-docker-tests.result }}" \
            "${{ needs.changes.outputs.run_sandbox_docker }}"

          mutation_expected=${{ github.event_name == 'merge_group' }}
          check_planned_job "critical-mutation" \
            "${{ needs.critical-mutation.result }}" \
            "${mutation_expected}"

          if [[ "${plan_mode}" == "none" ]]; then
            echo "No affected Reborn test surface — baseline recorded replay ran as planned"
          fi
